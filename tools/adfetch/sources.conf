DLX_URL=""
DLX_MODE="sit2"
# Internet Archive fallback (400 MB hybrid Mac/PC CD ISO). CONFIRMED byte-
# identical to the reference build: all 61 68K module rsrc forks + the shared
# "After Dark 4.0 Shared" data fork match the manifest exactly.
#   https://archive.org/details/after-dark-4-deluxe  ->  "After Dark 4.0 Deluxe (1996)(Berkeley Systems)[Mac-PC].iso"
#   ISO md5: d875a60338b73f44b7befa06bdd33aeb
DLX_URL_IA="https://archive.org/download/after-dark-4-deluxe/After%20Dark%204.0%20Deluxe%20%281996%29%28Berkeley%20Systems%29%5BMac-PC%5D.iso"
DLX_MODE_IA="hfsiso"

# If AD9_URL / DLX_URL are empty, adfetch uses the *_IA fallbacks (with a warning
# that the build may differ). Set ADFETCH_USE_IA=1 to force the IA sources even
# when the direct URLs are set.
