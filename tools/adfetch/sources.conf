# adfetch source configuration.  Sourced by adfetch.sh (plain KEY="value").
#
# You are responsible for your own right to download and use these files. The
# originals are copyrighted by Berkeley Systems (the After Dark brand continues
# via Infinisys). This project ships NONE of them; adfetch downloads them for
# YOUR local use only.
#
# Each source has a URL and a MODE describing how to unpack it:
#   sit1     - a StuffIt archive that expands directly to the tree (one `unar`)
#   sit2     - a StuffIt archive whose single member is ANOTHER StuffIt archive
#              that expands to the tree (two `unar` passes) -- the Deluxe layout
#   hfsimg2  - a raw HFS/HFS+ Macintosh disk image (`.img`); mounted with
#              hfsutils (hmount) and walked with a per-file hcopy -m + unar
#              loop -- needed because `unar` can't read the HFS filesystem
#              directly, only the individual (MacBinary'd) files inside it
#   hfsiso   - an ISO-9660 / hybrid Mac/PC CD image; same hfsutils hmount, but
#              the real tree is packed inside a single StuffIt installer file
#              on the disc ("Double-Click Me to Install") -- hcopy -m that one
#              item out, then two `unar` passes (it's a nested archive, like
#              sit2). Extraction FLATTENS all paths, so files are matched to
#              the manifest by filename, not by original folder location.
#
# hfsimg2/hfsiso both need hfsutils (`brew install hfsutils`); adfetch checks
# for it and dies with that hint if it's missing and one of these modes runs.
#
# You may point URL at:
#   * a local file  (file:///absolute/path.sit)  -- fastest, offline
#   * a direct http(s) URL to the exact StuffIt (guaranteed byte match if its
#     md5 equals the manifest's sourceArchives entry)
#   * an Internet Archive disk-image download URL (see research notes below) --
#     works, but is a different distribution/build, so per-file md5s may DIFFER
#     from the manifest; adfetch will report which files matched (WARN, not a
#     hard failure -- the emulation still runs off a different build).

# ---------------------------------------------------------------------------
# After Dark 9 / After Dark 4.0  (the PowerPC AD 4.0 modules + AD4Library.rsrc)
# Reference StuffIt: AD9v11fullpackage.sit  md5 87df3906d21651ed6bf8c8d0541efc75  (18,590,024 B)
# ---------------------------------------------------------------------------
# Preferred (exact-match) — supply the direct .sit URL if you have one.
#   PROVENANCE NOTE: the reference AD9v11fullpackage.sit is NOT on archive.org or (as of
#   2026-08) findable on macintoshrepository/macintoshgarden under that name. The Deluxe
#   .sit's provenance IS confirmed (MR item 2188, SHA1 match). Until an AD9 source is
#   located, the exact-build .sit remains user-supplied (file:///...) -- but this is now
#   optional, not required: the IA fallback below is CONTENT-IDENTICAL (see its comment),
#   so a clean fetch from IA alone verifies every PPC module including Time Flies, which
#   an earlier (buggier) extraction of the same image had mistakenly reported as dead.
AD9_URL=""
AD9_MODE="sit1"
# Internet Archive fallback (HFS disk image, ~50 MB). CONTENT-IDENTICAL to the
# reference build, confirmed by direct resource_dasm decode diff (0 bytes
# differ) for a 6-module sample (Time Flies, Flying Toasters!, Swirling Magic,
# Rodger Dodger, Art Critic, Marbles!) plus the AD4 Library -- and by an
# end-to-end runtime test: Time Flies, which used to crash when read raw off
# this image, now sustains motion identically to the reference build once
# extracted with the clean hcopy-m+unar recipe below. The image's raw fork
# md5 (below) does NOT match the reference .sit -- per-file comparison shows
# every PPC module rsrc fork + the AD4 Library rsrc differ byte-for-byte from
# the manifest's 'md5' -- but the ONLY differing bytes sit in the resource
# fork header's unused "reserved for system use" pad (bytes 16-255, Inside
# Macintosh; scratch space no Mac tool ever reads). Both this image and our
# reference build carry different leftover extraction-tool buffer garbage
# there (this image: a stray "PartSIT!" StuffIt-segment signature; the
# reference build: stray tokens from whatever tool built it) -- not real
# content, not resource compression. verify_manifest.py checks this image's
# forks against the manifest's 'md5Canonical' (md5 with that pad zeroed) and
# reports them 'ok' rather than differing. The real module tree on the image
# is nested at "System Folder:Control Panels:After Dark Files:After Dark
# 4.0:" -- NOT the empty top-level "After Dark 4.0" folder, which is a decoy.
#
# Attribution/history: the reference AD9v11fullpackage.sit descends from
# Daxeria's "After Dark 9" OS 9.1 compatibility patch for the After Dark 4.0
# control panel (macintoshgarden.org/apps/after-dark-os-9, ~May 2009), which
# decodes the control panel's own System-7-compressed resources (OS 9.1
# dropped resource decompression support). That patch ships the control panel
# ONLY, no modules -- AD9v11fullpackage.sit is a community-assembled bundle
# (control panel + prepared modules) whose module-decompression story does
# NOT apply to the modules themselves: none of the sampled AD 4.0 module rsrc
# forks (ours or the IA image's) carry any compressed resources at all (zero
# resources with the compression attribute set, zero embedded dcmp/ncmp
# resources) -- the forks are just plain, uncompressed, and identical in
# content to this IA image.
#   https://archive.org/details/after-dark-40  ->  AfterDark40.img
#   AfterDark40.img md5: 5a1200826e72352484b86b5ff086da0b
AD9_URL_IA="https://archive.org/download/after-dark-40/AfterDark40.img"
AD9_MODE_IA="hfsimg2"

